<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Chat - Example Client</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 400px;
      height: 600px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .connection-status {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      background: #f0f0f0;
    }

    .connection-status.connected {
      background: #d4edda;
      color: #155724;
    }

    .connection-status.disconnected {
      background: #f8d7da;
      color: #721c24;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      word-wrap: break-word;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .message.bot {
      align-self: flex-start;
      background: #f1f3f4;
      color: #333;
    }

    .message-time {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 5px;
    }

    .input-area {
      border-top: 1px solid #e0e0e0;
      padding: 15px;
      display: flex;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 25px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-area input:focus {
      border-color: #667eea;
    }

    .input-area button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      cursor: pointer;
      font-size: 18px;
      transition: transform 0.2s;
    }

    .input-area button:hover {
      transform: scale(1.05);
    }

    .input-area button:active {
      transform: scale(0.95);
    }

    .input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      Chat Support
    </div>
    <div class="connection-status" id="status">Connecting...</div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <input
        type="text"
        id="messageInput"
        placeholder="Type your message..."
        disabled
      />
      <button id="sendBtn" disabled>➤</button>
    </div>
  </div>

  <script>
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusDiv = document.getElementById('status');

    // Configuration
    const WS_URL = 'ws://localhost:3000/ws/chat';

    // User info (in real app, collect from a form)
    const userInfo = {
      first_name: 'John',
      last_name: 'Doe',
      language: 'en'
    };

    let ws = null;
    let sessionId = null;

    // Connect to WebSocket
    function connect() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        console.log('Connected to chat server');
        statusDiv.textContent = 'Connected';
        statusDiv.className = 'connection-status connected';
        messageInput.disabled = false;
        sendBtn.disabled = false;
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        console.log('Received:', data);

        if (data.type === 'connected') {
          sessionId = data.session_id;
          console.log('Session ID:', sessionId);
          addMessage('System', 'Connected to support. How can we help you today?', false);
        } else if (data.type === 'message') {
          addMessage('Support', data.text, false);
        } else if (data.type === 'error') {
          addMessage('System', `Error: ${data.message}`, false);
        }
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        statusDiv.textContent = 'Connection error';
        statusDiv.className = 'connection-status disconnected';
      };

      ws.onclose = () => {
        console.log('Disconnected from chat server');
        statusDiv.textContent = 'Disconnected';
        statusDiv.className = 'connection-status disconnected';
        messageInput.disabled = true;
        sendBtn.disabled = true;

        // Attempt to reconnect after 3 seconds
        setTimeout(() => {
          statusDiv.textContent = 'Reconnecting...';
          connect();
        }, 3000);
      };
    }

    // Send message
    function sendMessage() {
      const message = messageInput.value.trim();

      if (!message || !ws || ws.readyState !== WebSocket.OPEN) {
        return;
      }

      // Add to UI immediately
      addMessage('You', message, true);

      // Send to server
      ws.send(JSON.stringify({
        message: message,
        ...userInfo
      }));

      // Clear input
      messageInput.value = '';
    }

    // Add message to UI
    function addMessage(sender, text, isUser) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;

      const time = new Date().toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit'
      });

      messageDiv.innerHTML = `
        <div>${text}</div>
        <div class="message-time">${time}</div>
      `;

      messagesDiv.appendChild(messageDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Event listeners
    sendBtn.addEventListener('click', sendMessage);

    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });

    // Initialize connection
    connect();
  </script>
</body>
</html>
