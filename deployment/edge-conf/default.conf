map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Resolve service names at request time via Docker's embedded DNS.
#
# An `upstream` block (or a literal name in proxy_pass) is resolved ONCE when
# nginx loads its config. Any later `docker compose up` that recreates gateway
# or dashboard hands them a new container IP, and this container — which is not
# recreated on every deploy — keeps dialling the old address, so every request
# 502s with "connect() failed (111: Connection refused)" until edge is manually
# restarted. Putting the target in a variable forces a fresh lookup per request
# (cached `valid=10s`), so the edge follows containers across recreates.
resolver 127.0.0.11 valid=10s ipv6=off;

# Plain-HTTP visitors to the public domain are bounced to HTTPS here, so the
# redirect does not depend on Cloudflare's "Always Use HTTPS" edge rule.
# Cloudflare forwards HTTP visitors to origin :80 and HTTPS visitors to :443,
# so matching on the listening port is enough. Requests by raw IP fall through
# to the server below and are still served over :80, keeping direct-origin
# debugging and health checks working.
server {
  listen 80;
  server_name cache.us.kg www.cache.us.kg;
  return 301 https://$host$request_uri;
}

server {
  listen 80 default_server;

  # Cloudflare connects to the origin over HTTPS in "Full" / "Full (strict)"
  # SSL modes; without this listener the edge refuses :443 and Cloudflare
  # serves a 521. Certs live outside the synced tree (EDGE_CERT_DIR) so a
  # deploy's `rsync --delete` cannot remove them.
  listen 443 ssl default_server;
  http2 on;
  ssl_certificate     /etc/nginx/certs/origin.crt;
  ssl_certificate_key /etc/nginx/certs/origin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  server_name _;

  client_max_body_size 25m;

  # Gateway HTTP APIs + webhooks
  location /api/ {
    set $gateway gateway:3000;
    proxy_pass http://$gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /webhook/ {
    set $gateway gateway:3000;
    proxy_pass http://$gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Agent + customer websockets
  location /ws/ {
    set $gateway gateway:3000;
    proxy_pass http://$gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Optional docs / swagger from gateway
  location /swagger {
    set $gateway gateway:3000;
    proxy_pass http://$gateway;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Dashboard (SPA)
  location / {
    set $dashboard dashboard:80;
    proxy_pass http://$dashboard;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
