# Core stack: Gateway + Routing + Chatbot + Lead Manager + Notification +
# Appointment + Dashboard + edge proxy.
name: omnichannel-core

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messaging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  routing:
    build: ../apps/routing
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GCE_METADATA_HOST: ${GCE_METADATA_HOST:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CHATBOT_ENGINE_URL: http://chatbot:3003
      APPOINTMENT_SERVICE_URL: http://appointment:3005
      LEAD_MANAGER_URL: http://lead-manager:3002
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  chatbot:
    build: ../../chatbot-builder
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      NODE_ENV: production
      DATABASE_PATH: /data/chatbot.db
      # Lead Manager is deployed now, so chatbot conversations can capture leads.
      # leadClient is best-effort (timeout-guarded, returns null) — if lead-manager
      # is down the customer still gets their reply.
      LEAD_INTEGRATION_ENABLED: ${LEAD_INTEGRATION_ENABLED:-true}
      LEAD_MANAGER_URL: http://lead-manager:3002
      APPOINTMENT_INTEGRATION_ENABLED: "false"
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GCE_METADATA_HOST: ${GCE_METADATA_HOST:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LLM_ROUTING_ENABLED: ${LLM_ROUTING_ENABLED:-true}
      # Reads the tenant's name/sector/description to give the FAQ matcher
      # business context. Best-effort: unreachable means no extra context.
      GATEWAY_URL: http://gateway:3000
      # Gateway /api/ routes require a credential; sibling services have no
      # user session and present this shared token instead.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    volumes:
      - chatbot_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://127.0.0.1:3003/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  lead-manager:
    build: ../apps/lead-manager
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: production
      DATABASE_PATH: /data/leads.db
      NOTIFICATION_SERVICE_URL: http://notification:3004
      GATEWAY_SERVICE_URL: http://gateway:3000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      # Routing's /chat body carries no business_id yet, so leads created from
      # the lead_qualification intent land on this tenant. Keep it aligned with
      # the business the dashboard is built against.
      DEFAULT_BUSINESS_ID: ${DASHBOARD_BUSINESS_ID:-biz_demo_salon}
      AGENT_POOL: ${AGENT_POOL:-agent_1,agent_2,agent_3}
    volumes:
      - lead_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Stores the lead events Lead Manager posts here and serves them back as the
  # dashboard's in-app notification centre. Templated email uses SMTP when enabled.
  notification:
    build: ../apps/notification
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      NODE_ENV: production
      DATABASE_PATH: /data/notification.db
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - notification_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://127.0.0.1:3004/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  appointment:
    build: ../apps/appointment
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      NODE_ENV: production
      DATABASE_PATH: /data/appointments.db
      NOTIFICATION_SERVICE_URL: http://notification:3004
      # Gemini pulls the date/time/service out of the customer's message.
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GCE_METADATA_HOST: ${GCE_METADATA_HOST:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Customers say "3pm" meaning their local time; stored rows stay UTC.
      BUSINESS_UTC_OFFSET_MINUTES: ${BUSINESS_UTC_OFFSET_MINUTES:-0}
      # Fallback opening hours, used only for tenants that have not saved their
      # own. Per-business hours live on the gateway and are read from there.
      BUSINESS_OPEN_HOUR: ${BUSINESS_OPEN_HOUR:-9}
      BUSINESS_CLOSE_HOUR: ${BUSINESS_CLOSE_HOUR:-17}
      GATEWAY_URL: http://gateway:3000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    volumes:
      - appointment_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://127.0.0.1:3005/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  gateway:
    build: ../apps/gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/messaging
      DATABASE_SSL: "false"
      ROUTING_AGENT_URL: http://routing:3001/chat
      # The edge only exposes /api/ on this gateway, so leads and appointments
      # are proxied through it rather than published as separate origins.
      LEAD_MANAGER_URL: http://lead-manager:3002
      APPOINTMENT_SERVICE_URL: http://appointment:3005
      # FAQs, chatbot config, sector templates and flows — the dashboard's
      # Settings screens reach chatbot-builder only through this proxy.
      CHATBOT_SERVICE_URL: http://chatbot:3003
      # In-app notification centre (the bell in the dashboard header).
      NOTIFICATION_SERVICE_URL: http://notification:3004
      # Gemini reads inbound voice notes and photos here, at the edge, and turns
      # them into text — so no object storage or speech-to-text service is needed
      # and every downstream service keeps receiving plain text.
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      GCE_METADATA_HOST: ${GCE_METADATA_HOST:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://cache.us.kg}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://cache.us.kg,http://cache.us.kg}
      AGENT_AUTH_MODE: ${AGENT_AUTH_MODE:-none}
      # Dashboard sessions. Without AUTH_JWT_SECRET the gateway refuses to
      # start in production rather than serving /api/ unauthenticated.
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-12}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      # Self-hosted WhatsApp. The evolution-api container joins this network from
      # its own compose file (../evolution-api), so the name resolves once that
      # stack is up. Without EVOLUTION_API_KEY the WhatsApp connect endpoints
      # throw "EVOLUTION_API_KEY is not configured" and the rest of the gateway
      # is unaffected.
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      routing:
        condition: service_started
      chatbot:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "run",
          "-e",
          "fetch('http://127.0.0.1:3000/api/messaging/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dashboard:
    build:
      context: ../../web-dashboard
      args:
        VITE_GATEWAY_URL: ${PUBLIC_BASE_URL:-https://cache.us.kg}
        VITE_BUSINESS_ID: ${DASHBOARD_BUSINESS_ID:-}
        VITE_BUSINESS_NAME: ${DASHBOARD_BUSINESS_NAME:-}
        VITE_BUSINESS_SECTOR: ${DASHBOARD_BUSINESS_SECTOR:-}
        VITE_BUSINESS_EMAIL: ${DASHBOARD_BUSINESS_EMAIL:-}
        VITE_AGENT_ESCALATION_QUEUE_ENABLED: ${DASHBOARD_AGENT_ESCALATION_QUEUE_ENABLED:-true}
        VITE_BUSINESS_PROFILE_UPDATE_ENABLED: ${DASHBOARD_BUSINESS_PROFILE_UPDATE_ENABLED:-true}
        VITE_ANALYTICS_ENABLED: ${DASHBOARD_ANALYTICS_ENABLED:-true}
        VITE_NOTIFICATION_CENTER_ENABLED: ${DASHBOARD_NOTIFICATION_CENTER_ENABLED:-true}
        VITE_WEB_CHAT_ENABLED: ${DASHBOARD_WEB_CHAT_ENABLED:-true}
        # Off until the gateway has POCKETBASE_URL: without storage every
        # attachment upload answers 503.
        VITE_IMAGE_ATTACHMENTS_ENABLED: ${DASHBOARD_IMAGE_ATTACHMENTS_ENABLED:-false}
    restart: unless-stopped
    # Keep direct port for debugging; public traffic should use edge :80
    ports:
      - "5173:80"
    depends_on:
      - gateway

  edge:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount the directory, not the file: a deploy's rsync replaces the config
      # with a new inode, and a single-file bind mount would keep serving the
      # old content until the container was recreated.
      - ./edge-conf:/etc/nginx/conf.d:ro
      - ${EDGE_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      - gateway
      - dashboard

volumes:
  postgres_data:
  chatbot_data:
  appointment_data:
  lead_data:
  notification_data:
